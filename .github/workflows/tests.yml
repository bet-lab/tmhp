name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev group + integrations extra, lockfile pinned)
        run: uv sync --group dev --extra integrations --locked

      - name: Ruff lint
        run: uv run ruff check src/tmhp tests

      - name: Mypy
        run: uv run mypy src/tmhp

      - name: Pytest with coverage
        run: |
          uv run pytest -q \
            --cov=tmhp \
            --cov-report=term \
            --cov-report=xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  docs:
    # Sphinx output is Python-version-independent; run once and gate PRs on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so sphinx-last-updated-by-git can compute the
          # per-page modification timestamps. The default shallow clone
          # (depth=1) trips the `git.too_shallow` warning for every page.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project (dev + docs groups, lockfile pinned)
        run: uv sync --all-groups --locked

      - name: Build docs with interactive data (warnings-as-errors)
        run: make -C docs html SPHINXOPTS="-W --keep-going"
