name: tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (with dev group)
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src/physics_hp tests

      - name: Mypy
        run: uv run mypy src/physics_hp

      - name: Pytest
        run: uv run pytest -q

  docs:
    # Sphinx output is Python-version-independent; run once and gate PRs on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project (dev + docs groups)
        run: uv sync --all-groups

      - name: Sphinx build (warnings-as-errors)
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html
